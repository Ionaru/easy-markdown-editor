name: CI

on:
    push:
        branches: [master, v3]
    pull_request:
        branches: [master, v3]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: voidzero-dev/setup-vp@v1
              with:
                  node-version: "24"
                  cache: true

            - run: vp install

            # Browser-mode tests run in real Chromium via the Playwright provider,
            # so the browser binary and its system dependencies must be present.
            - run: npx playwright install --with-deps chromium

            - run: vp check
            - run: vp test

            # Ensure the dist artifact builds cleanly (build script -> vp pack).
            - run: vp run build
